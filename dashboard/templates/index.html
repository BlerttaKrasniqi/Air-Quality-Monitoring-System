<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Air Quality Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #cbf5f6;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .metrics {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .metric {
            background: #f67676;
            padding: 15px 20px;
            margin: 10px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(99, 3, 3, 0.1);
            text-align: center;
            min-width: 140px;
            font-weight: bold;
        }

        .alert-box {
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }

        .alert-high { background-color: #f8d7da; color: #721c24; }
        .alert-medium { background-color: #fff3cd; color: #856404; }
        .alert-good { background-color: #d4edda; color: #155724; }

        #chart-container {
            max-width: 900px;
            margin: 40px auto;
        }
    </style>
</head>
<body>
    <h1>🌬️ Smart Air Quality Dashboard</h1>

    <div class="metrics">
        <div class="metric">PM2.5: <span id="pm25">--</span></div>
        <div class="metric">PM10: <span id="pm10">--</span></div>
        <div class="metric">CO2: <span id="co2">--</span></div>
        <div class="metric">Temperature: <span id="temperature">--</span></div>
        <div class="metric">Humidity: <span id="humidity">--</span></div>
    </div>

    <div id="alertBox" class="alert-box"></div>

    <div id="chart-container">
        <canvas id="realtimeChart"></canvas>
    </div>

    <script>
        const labels = [];
        const pm25Data = [];
        const co2Data = [];

        const chart = new Chart(document.getElementById("realtimeChart"), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'PM2.5',
                        data: pm25Data,
                        borderColor: 'rgba(255, 99, 132, 1)',
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                        tension: 0.3
                    },
                    {
                        label: 'CO2',
                        data: co2Data,
                        borderColor: 'rgba(54, 162, 235, 1)',
                        backgroundColor: 'rgba(54, 162, 235, 0.2)',
                        tension: 0.3
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });

        function updateDashboard(data) {
            document.getElementById('pm25').textContent = data.pm25;
            document.getElementById('pm10').textContent = data.pm10;
            document.getElementById('co2').textContent = data.co2;
            document.getElementById('temperature').textContent = data.temperature;
            document.getElementById('humidity').textContent = data.humidity;

            labels.push(new Date(data.timestamp).toLocaleTimeString());
            pm25Data.push(data.pm25);
            co2Data.push(data.co2);

            if (labels.length > 20) {
                labels.shift();
                pm25Data.shift();
                co2Data.shift();
            }

            chart.update();

            showAlert(data.pm25, data.co2);
        }

        function showAlert(pm25, co2) {
            const alertBox = document.getElementById("alertBox");
            if (pm25 > 100 || co2 > 1000) {
                alertBox.textContent = "🚨 Warning: Poor Air Quality Detected!";
                alertBox.className = "alert-box alert-high";
                alertBox.style.display = "block";
            } else if (pm25 > 50 || co2 > 700) {
                alertBox.textContent = "⚠️ Moderate Air Quality";
                alertBox.className = "alert-box alert-medium";
                alertBox.style.display = "block";
            } else {
                alertBox.textContent = "✅ Good Air Quality";
                alertBox.className = "alert-box alert-good";
                alertBox.style.display = "block";
            }
        }

        async function fetchData() {
            try {
                const res = await axios.get("/api/realtime-data");
                updateDashboard(res.data);
            } catch (err) {
                console.error("Error fetching data:", err);
            }
        }

        setInterval(fetchData, 5000);
        fetchData(); // initial call
    </script>
</body>
</html>
