<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Air Quality Sensor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            padding: 30px;
        }
        .sensor-card {
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
            margin-top: 15px;
        }
        .status-message {
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
            font-size: 14px;
        }
        .predicted-value {
            font-size: 24px;
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4 text-center">Smart Air Quality Sensor</h2>
        
        <!-- Current Sensor Data -->
        <div class="row text-center mb-4" id="sensorData">
        <div class="row text-center" id="sensorData">
            <div class="col-md-3"><div class="card sensor-card p-3 mb-3"><h5>PM2.5</h5><span id="pm25">--</span> µg/m³</div></div>
            <div class="col-md-3"><div class="card sensor-card p-3 mb-3"><h5>PM10</h5><span id="pm10">--</span> µg/m³</div></div>
            <div class="col-md-3"><div class="card sensor-card p-3 mb-3"><h5>CO₂</h5><span id="co2">--</span> ppm</div></div>
            <div class="col-md-3"><div class="card sensor-card p-3 mb-3"><h5>Temperature</h5><span id="temperature">--</span> °C</div></div>
            <div class="col-md-3"><div class="card sensor-card p-3 mb-3"><h5>Humidity</h5><span id="humidity">--</span> %</div></div>
            <div class="col-md-3"><div class="card sensor-card p-3 mb-3"><h5>Sensor ID</h5><span id="sensor_id">--</span></div></div>
            <div class="col-md-6"><div class="card sensor-card p-3 mb-3"><h5>Timestamp</h5><span id="timestamp">--</span></div></div>
        </div>
        
        <!-- AI Prediction Section -->
        <h3 class="mb-3 text-center">AI Predictions</h3>
        <div class="row" id="predictionSection">
            <!-- Current Prediction -->
            <div class="col-md-4">
                <div class="card sensor-card p-3 mb-3">
                    <h5 class="text-center">Predicted PM2.5</h5>
                    <div class="text-center predicted-value" id="predicted-pm25">--</div>
                    <div class="text-center">µg/m³</div>
                </div>
            </div>
            
            <!-- Prediction Chart -->
            <div class="col-md-8">
                <div class="card sensor-card p-3 mb-3">
                    <h5 class="text-center">24-Hour Forecast</h5>
                    <div class="chart-container">
                        <canvas id="prediction-chart"></canvas>
                    </div>
                    <div id="chart-debug" class="text-center text-muted mt-2" style="font-size: 12px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Variable to store last model timestamp
        let lastTimestamp = null;
      
        async function loadSensorData() {
            try {
                const response = await axios.get("/api/realtime-data");
                const data = response.data;

                document.getElementById("pm25").innerText = data.pm25;
                document.getElementById("pm10").innerText = data.pm10;
                document.getElementById("co2").innerText = data.co2;
                document.getElementById("temperature").innerText = data.temperature;
                document.getElementById("humidity").innerText = data.humidity;
                document.getElementById("sensor_id").innerText = data.sensor_id;
                document.getElementById("timestamp").innerText = data.timestamp;
                
                // After loading sensor data, update predictions
                getPredictions(data);
            } catch (err) {
                console.error("Error fetching data:", err);
            }
        }
        
        async function getPredictions(sensorData) {
            try {
                const debugElement = document.getElementById('chart-debug');
                if (debugElement) {
                    debugElement.textContent = 'Fetching predictions...';
                }
                
                // Use the provided sensor data or create default data
                const latestData = sensorData || {
                    temperature: parseFloat(document.getElementById("temperature").innerText || '25'),
                    humidity: parseFloat(document.getElementById("humidity").innerText || '60'),
                    co2: parseFloat(document.getElementById("co2").innerText || '450'),
                    timestamp: document.getElementById("timestamp").innerText || new Date().toISOString()
                };

                // Call the prediction API
                const predictionResponse = await axios.post('/api/predict', latestData);
                
                if (predictionResponse.data.error) {
                    console.error('Prediction error:', predictionResponse.data.error);
                    if (debugElement) {
                        debugElement.textContent = `Error: ${predictionResponse.data.error}`;
                    }
                    return;
                }
                
                // Display the prediction in the UI
                const predictedValue = predictionResponse.data.predicted_pm25.toFixed(2);
                document.getElementById('predicted-pm25').textContent = predictedValue;
                
                // Get future predictions for chart
                const futureResponse = await axios.post('/api/predict_future', latestData);
                
                if (debugElement) {
                    debugElement.textContent = 'Processing prediction data...';
                }
                
                if (Array.isArray(futureResponse.data)) {
                    updatePredictionChart(futureResponse.data);
                } else {
                    console.error('Invalid prediction data format:', futureResponse.data);
                    if (debugElement) {
                        debugElement.textContent = 'Error: Invalid prediction data format';
                    }
                }
            } catch (error) {
                console.error('Error fetching predictions:', error);
                const debugElement = document.getElementById('chart-debug');
                if (debugElement) {
                    debugElement.textContent = `Error: ${error.message || 'Could not fetch predictions'}`;
                }
            }
        }

        function updatePredictionChart(predictions) {
            const debugElement = document.getElementById('chart-debug');
            
            const labels = predictions.map(p => {
                const date = new Date(p.timestamp);
                return date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            });
            
            const values = predictions.map(p => p.predicted_pm25);
            
            // Create or update the chart
            if (!window.predictionChart) {
                const ctx = document.getElementById('prediction-chart').getContext('2d');
                window.predictionChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Predicted PM2.5',
                            data: values,
                            borderColor: 'rgba(40, 167, 69, 1)',
                            backgroundColor: 'rgba(40, 167, 69, 0.2)',
                            tension: 0.1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'top',
                            },
                            tooltip: {
                                mode: 'index',
                                intersect: false,
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'PM2.5 (μg/m³)'
                                }
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Time'
                                }
                            }
                        }
                    }
                });
                
                if (debugElement) {
                    debugElement.textContent = 'Chart initialized successfully';
                }
            } else {
                window.predictionChart.data.labels = labels;
                window.predictionChart.data.datasets[0].data = values;
                window.predictionChart.update();
                
                if (debugElement) {
                    debugElement.textContent = `Chart updated: ${new Date().toLocaleTimeString()}`;
                }
            }
        }
        
        async function trainAIModel() {
            try {
                // Show training status
                const statusElement = document.getElementById('training-status');
                if (statusElement) {
                    statusElement.textContent = 'Training in progress... This may take several minutes.';
                    statusElement.className = 'status-message bg-info text-white';
                }
                
                const response = await axios.post('/api/train-model', {
                    data_source: 'cassandra',
                    days: 2 // Number of days of data to use for training
                });
                
                if (response.data.status === 'success') {
                    if (statusElement) {
                        statusElement.textContent = `Training started successfully. This may take several minutes.`;
                        statusElement.className = 'status-message bg-success text-white';
                    } else {
                        alert('Model training started successfully!');
                    }
                    
                    // Check training status periodically
                    checkTrainingStatus();
                } else {
                    if (statusElement) {
                        statusElement.textContent = `Error starting training: ${response.data.error}`;
                        statusElement.className = 'status-message bg-danger text-white';
                    } else {
                        alert(`Error starting training: ${response.data.error}`);
                    }
                }
                
            } catch (error) {
                console.error('Error training model:', error);
                const statusElement = document.getElementById('training-status');
                if (statusElement) {
                    statusElement.textContent = `Error: ${error.message || 'Could not train model'}`;
                    statusElement.className = 'status-message bg-danger text-white';
                } else {
                    alert(`Error training model: ${error.message || 'Unknown error'}`);
                }
            }
        }

        async function checkTrainingStatus() {
            // Check training status every 30 seconds
            const checkInterval = setInterval(async () => {
                try {
                    const response = await axios.get('/api/model-info');
                    
                    if (response.data.status === 'success') {
                        document.getElementById('model-timestamp').textContent = response.data.timestamp || 'Not trained';
                        document.getElementById('model-accuracy').textContent = response.data.accuracy ? `${response.data.accuracy}` : 'N/A';
                        
                        const statusElement = document.getElementById('training-status');
                        
                        // If timestamp has changed, training is complete
                        if (response.data.timestamp && response.data.timestamp !== lastTimestamp) {
                            if (statusElement) {
                                statusElement.textContent = `Model trained successfully! Accuracy: ${response.data.accuracy || 'N/A'}`;
                                statusElement.className = 'status-message bg-success text-white';
                            }
                            
                            // Get new predictions with the new model
                            loadSensorData();
                            
                            // Stop checking
                            clearInterval(checkInterval);
                        }
                        
                        // Store timestamp for comparison
                        lastTimestamp = response.data.timestamp;
                    }
                } catch (error) {
                    console.error('Error checking model status:', error);
                }
            }, 30000); // Every 30 seconds
            
            // Stop checking after 30 minutes (training should be done by then)
            setTimeout(() => {
                clearInterval(checkInterval);
            }, 30 * 60 * 1000);
        }

        async function fetchModelInfo() {
            try {
                const response = await axios.get('/api/model-info');
                
                if (response.data.status === 'success') {
                    document.getElementById('model-timestamp').textContent = response.data.timestamp || 'Not trained';
                    document.getElementById('model-accuracy').textContent = response.data.accuracy ? `${response.data.accuracy}` : 'N/A';
                    
                    // Store timestamp for comparison
                    lastTimestamp = response.data.timestamp;
                }
            } catch (error) {
                console.error('Error fetching model info:', error);
            }
        }
        
        // Initialize the dashboard
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize chart with empty data
            const ctx = document.getElementById('prediction-chart').getContext('2d');
            window.predictionChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array(24).fill(0).map((_, i) => `+${i}h`),
                    datasets: [{
                        label: 'Predicted PM2.5',
                        data: Array(24).fill(null),
                        borderColor: 'rgba(40, 167, 69, 1)',
                        backgroundColor: 'rgba(40, 167, 69, 0.2)',
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'PM2.5 (μg/m³)'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Time'
                            }
                        }
                    }
                }
            });
            
            // Fetch model info
            fetchModelInfo();
            
            // Load sensor data and update predictions
            loadSensorData();
            
            // Update data every 5 seconds
            setInterval(loadSensorData, 5000);
        });
       
        loadSensorData();
        setInterval(loadSensorData, 5000);
    </script>
</body>
</html>
