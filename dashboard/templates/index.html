<!DOCTYPE html>
<html>
<head>
    <title>Air Quality Dashboard</title>
     <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div style="margin-bottom: 20px;">
        <a href="/simulate" style="background: #007bff; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px;">🔧 Sensor Simulator</a>
    </div>
    <h1>Latest Air Quality Data</h1>
     <canvas id="pmChart" width="400" height="200"></canvas>
    <canvas id="tempChart" width="400" height="200"></canvas>

    <script>
    const data = /* {{ data | tojson | safe }} */ [];
    const timestamps = data.map(entry => entry.timestamp);
    const pm25 = data.map(entry => entry.pm25);
    const temperature = data.map(entry => entry.temperature);

    new Chart(document.getElementById('pmChart'), {
        type: 'line',
        data: {
            labels: timestamps,
            datasets: [{
                label: 'PM2.5',
                data: pm25,
                fill: false,
                borderColor: 'blue'
            }]
        }
    });

    new Chart(document.getElementById('tempChart'), {
        type: 'line',
        data: {
            labels: timestamps,
            datasets: [{
                label: 'Temperature (°C)',
                data: temperature,
                fill: false,
                borderColor: 'red'
            }]
        }
    });
</script>
    <table border="1">
        <tr>
            <th>Timestamp</th>
            <th>PM2.5</th>
            <th>PM10</th>
            <th>CO2</th>
            <th>Temperature</th>
            <th>Humidity</th>
        </tr>
        {% for row in data %}
        <tr>
            <td>{{ row.timestamp }}</td>
            <td>{{ row.pm25 }}</td>
            <td>{{ row.pm10 }}</td>
            <td>{{ row.co2 }}</td>
            <td>{{ row.temperature }}</td>
            <td>{{ row.humidity }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
