<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Air Quality Sensor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            padding: 30px;
        }
        .sensor-card {
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4 text-center">Smart Air Quality Sensor</h2>
        <div class="row text-center" id="sensorData">
            <div class="col-md-3"><div class="card sensor-card p-3 mb-3"><h5>PM2.5</h5><span id="pm25">--</span> µg/m³</div></div>
            <div class="col-md-3"><div class="card sensor-card p-3 mb-3"><h5>PM10</h5><span id="pm10">--</span> µg/m³</div></div>
            <div class="col-md-3"><div class="card sensor-card p-3 mb-3"><h5>CO₂</h5><span id="co2">--</span> ppm</div></div>
            <div class="col-md-3"><div class="card sensor-card p-3 mb-3"><h5>Temperature</h5><span id="temperature">--</span> °C</div></div>
            <div class="col-md-3"><div class="card sensor-card p-3 mb-3"><h5>Humidity</h5><span id="humidity">--</span> %</div></div>
            <div class="col-md-3"><div class="card sensor-card p-3 mb-3"><h5>Sensor ID</h5><span id="sensor_id">--</span></div></div>
            <div class="col-md-6"><div class="card sensor-card p-3 mb-3"><h5>Timestamp</h5><span id="timestamp">--</span></div></div>
        </div>
    </div>

    <script>
        async function loadSensorData() {
            try {
                const response = await axios.get("/api/realtime-data");
                const data = response.data;

                document.getElementById("pm25").innerText = data.pm25;
                document.getElementById("pm10").innerText = data.pm10;
                document.getElementById("co2").innerText = data.co2;
                document.getElementById("temperature").innerText = data.temperature;
                document.getElementById("humidity").innerText = data.humidity;
                document.getElementById("sensor_id").innerText = data.sensor_id;
                document.getElementById("timestamp").innerText = data.timestamp;
            } catch (err) {
                console.error("Error fetching data:", err);
            }
        }

       
        loadSensorData();
        setInterval(loadSensorData, 5000);
    </script>
</body>
</html>
