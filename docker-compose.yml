# no version: key needed
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports: ["2181:2181"]
    healthcheck:
      test: ["CMD-SHELL", "sh -c '</dev/tcp/127.0.0.1/2181'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
      - "29092:29092"   # host access
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "kafka-topics --create --if-not-exists --topic sensor-data --partitions 1 --replication-factor 1 --bootstrap-server kafka:9092"
    restart: "no"

  cassandra:
    image: cassandra:4.1
    ports: ["9042:9042"]
    volumes:
      - cassandra_data:/var/lib/cassandra
    environment:
      MAX_HEAP_SIZE: 256M
      HEAP_NEWSIZE: 54M
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESC KEYSPACES' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  cassandra-init:
    image: cassandra:4.1
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra/schema.cql:/schema.cql
    entrypoint: ["/bin/sh","-c","cqlsh cassandra -f /schema.cql"]
    restart: "no"

  spark-master:
    image: bitnami/spark:3.5.1
    environment:
      - SPARK_MODE=master
    ports:
      - "8081:8080"     # Spark Master UI
      - "7077:7077"     # Spark Master RPC
    volumes:
      - ./stream_processor:/opt/spark_app
    restart: unless-stopped

  spark-worker:
    image: bitnami/spark:3.5.1
    depends_on:
      spark-master:
        condition: service_started
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    restart: unless-stopped

  spark-submit:
    image: bitnami/spark:3.5.1
    depends_on:
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      kafka:
        condition: service_started
      cassandra:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./stream_processor:/opt/spark_app
      - spark_checkpoints:/opt/spark_checkpoints
    command:
      [
        "/opt/bitnami/spark/bin/spark-submit",
        "--master","spark://spark-master:7077",
        "--packages","org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,com.datastax.spark:spark-cassandra-connector_2.12:3.4.1,com.github.jnr:jnr-ffi:2.2.13",
        "--conf","spark.cassandra.connection.host=cassandra",
        "--conf","spark.cassandra.connection.port=9042",
        "/opt/spark_app/stream_processor.py"
      ]

  simulator:
    build: ./sensor_simulator
    environment:
      KAFKA_BOOTSTRAP: "kafka:9092"
      KAFKA_TOPIC: "sensor-data"
      SENSOR_LOCATION: "Pristina"
      SENSOR_LAT: "42.6629"
      SENSOR_LON: "21.1655"
      SEND_INTERVAL_SEC: "5"
      GPS_JITTER_METERS: "30"
      DEVICE_COUNT: "3"
      EVENT_PROB: "0.03"
      EVENT_MEAN_DURATION_SEC: "20"
      SIM_SEED: "42"
      LOG_LEVEL: "INFO"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./dashboard
    environment:
      CASSANDRA_HOST: cassandra
      CASSANDRA_KEYSPACE: air_monitoring
      CASSANDRA_TABLE: sensor_data
      PORT: 5000
    ports:
      - "5001:5000"
    volumes:
      - ./dashboard:/app
      - ./sensor_simulator:/app/sensor_simulator
      - ./models:/app/models
    depends_on:
      cassandra:
        condition: service_healthy
    restart: unless-stopped

  consumer:
    build:
      context: ./kafka_consumer
      dockerfile: Dockerfile
    environment:
      KAFKA_BOOTSTRAP: "kafka:9092"
      KAFKA_TOPIC: "sensor-data"
      GROUP_ID: "debug-consumer"
      LOG_LEVEL: "INFO"
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    profiles: ["debug"]

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    depends_on:
      - frontend

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/air_quality_dashboard.json:/etc/grafana/provisioning/dashboards/
      - ./config/grafana-dashboard-config.yaml:/etc/grafana/provisioning/dashboards/
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  cassandra_data:
  prometheus_data:
  grafana_data:
  spark_checkpoints:
