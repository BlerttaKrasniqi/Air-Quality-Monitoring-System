services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

  cassandra:
    image: cassandra:latest
    ports:
      - "9042:9042"

    mem_limit: 1g
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 10s
      timeout: 10s
      retries: 5

  spark-master:
    image: bitnami/spark:3.5.1
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "127.0.0.1:7077:7077"
    volumes:
      - ./stream_processor:/opt/spark_app
    command: ["/opt/bitnami/scripts/spark/entrypoint.sh", "/opt/bitnami/scripts/spark/run.sh"]

  spark-worker:
    image: bitnami/spark:3.5.1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on:
      - spark-master
    command: ["/bin/bash", "-c", "mkdir -p /tmp/home && export HOME=/tmp/home && /opt/bitnami/scripts/spark/entrypoint.sh /opt/bitnami/scripts/spark/run.sh"]

  spark-submit:
    image: bitnami/spark:3.5.1
    depends_on:
      cassandra:
        condition: service_healthy
      kafka:
        condition: service_started
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
    volumes:
      - ./stream_processor:/opt/spark_app
    command: ["/bin/bash", "-c", "mkdir -p /tmp/home && export HOME=/tmp/home && spark-submit --master spark://spark-master:7077 --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,com.datastax.spark:spark-cassandra-connector_2.12:3.2.0 --conf spark.jars.ivy=/tmp /opt/spark_app/stream_processor.py"]

  simulator:
    build: ./sensor_simulator
    depends_on:
      - kafka

  frontend:
    build: ./dashboard
    ports:
      - "8501:8501"
    depends_on:
      - cassandra

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"  # Porti për Prometheus UI
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml  # Konfigurimi i Prometheus
    networks:
      - monitoring

  # Grafana (visualizimi i metrikave)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"  # Porti për Grafana UI
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin  # Përdoruesi dhe fjalëkalimi për Grafana
    volumes:
      - grafana-storage:/var/lib/grafana  # Për ruajtjen e të dhënave të Grafana
    networks:
      - monitoring
    depends_on:
      - prometheus

  # Cassandra Exporter (për mbledhjen e metrikave nga Cassandra)
  cassandra-exporter:
    image: bitnami/cassandra-exporter:latest
    container_name: cassandra-exporter
    ports:
      - "9180:9180"  # Porti për Cassandra Exporter
    environment:
      - CASSANDRA_URL=cassandra:9042  # URL për Cassandra
    networks:
      - monitoring

  # Kafka Exporter (për mbledhjen e metrikave nga Kafka)
  kafka-exporter:
    image: bitnami/kafka-exporter:latest
    container_name: kafka-exporter
    ports:
      - "9308:9308"  # Porti për Kafka Exporter
    environment:
      - KAFKA_SERVER=kafka:9092  # URL për Kafka
    networks:
      - monitoring

  # Spark Exporter (për mbledhjen e metrikave nga Spark)
  spark-exporter:
    image: bitnami/spark-exporter:latest
    container_name: spark-exporter
    ports:
      - "4040:4040"  # Porti për Spark Exporter
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  grafana-storage: